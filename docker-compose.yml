services:
  job-analysis:
    build: .
    container_name: job-analysis
    ports:
      - "5000:5000"
    volumes:
      # 数据库目录挂载（而非单文件）：SQLite 的 -wal/-shm 日志与主库同卷，
      # 宿主机采集与容器读写共享同一套日志，避免双 WAL 各写各的造成库损坏。
      # 老库迁移: mkdir db && mv data.db db/ 一次即可。
      - ./db:/app/db
      # 模板/源码热更新（开发时不需重建镜像）
      - ./templates:/app/templates
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
    env_file:
      # 可选：配置 DEEPSEEK_API_KEY
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 数据库路径指向挂载目录（config.py 支持该环境变量）
      - DB_PATH=/app/db/data.db
    restart: unless-stopped
